[package]
name = "mft_core"
version = "0.1.0"
edition = "2021"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }

# websocket client
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
url = "2.5"

# json parsing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# system monitoring (ram)
sysinfo = "0.30"

# time & dates
chrono = "0.4"

# compression (zstd)
async-compression = { version = "0.4", features = ["tokio", "zstd"] }